name: Browser checks

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Browser validation scope
        type: choice
        default: smoke
        options:
          - smoke
          - compatibility
          - full

concurrency:
  group: browsers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'full' && 60 || 15 }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - run: bun install --frozen-lockfile

      - name: Install Chromium for requested smoke checks
        if: inputs.suite == 'smoke'
        run: bunx playwright install --with-deps chromium

      - name: Check essential interactions
        if: inputs.suite == 'smoke'
        run: bun run test:browser:smoke

      - name: Install browsers for requested validation
        if: inputs.suite != 'smoke'
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Check browser-specific behavior
        if: inputs.suite == 'compatibility'
        run: bun run test:browser:compat

      - name: Run the full catalog sweep
        if: inputs.suite == 'full'
        run: bun run test:browser
